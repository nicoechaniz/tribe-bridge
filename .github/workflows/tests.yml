name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: protocol/v1/requirements-test.txt
      - name: Install test requirements
        run: python -m pip install -r protocol/v1/requirements-test.txt
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
