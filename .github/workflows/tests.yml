name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: protocol/v1/requirements-test.txt
      - name: Install test requirements
        run: python -m pip install -r protocol/v1/requirements-test.txt
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
